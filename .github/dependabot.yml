version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
    open-pull-requests-limit: 2
    groups:
       # Semver-major bumps get their own PR, so that one breaking upgrade
       # doesn't sink the whole group.
       cargo-deps:
          patterns:
            - "*"
          update-types:
            - "minor"
            - "patch"
    ignore:
      # The macro crates are written against syn 2; moving to syn 3 is a
      # manual migration. prettyplease 0.3 requires syn 3.
      - dependency-name: "syn"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prettyplease"
        versions: [">=0.3"]

  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "monthly"
    target-branch: "master"
    groups:
       website-deps:
          patterns:
            - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "master"
